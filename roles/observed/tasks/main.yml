- name: Install prometheus-client
  pip:
    name: prometheus-client
    state: present
  when: deployment_method != "container"

- name: Copy prometheus server script
  copy:
    src: files/prometheus_server.py
    dest: /opt/prometheus_server.py
    mode: 0644



- name: Install firewalld
  dnf: 
    name: firewalld
    state: present

- name: Start firewalld service
  systemd:
    name: firewalld
    state: started
    enabled: yes

- name: Check if port 8080 is already open
  command: firewall-cmd --list-ports 
  register: firewall_ports
  changed_when: false

- name: Make firewall allow port 8080
  command: firewall-cmd --add-port=8080/tcp 
  when: "'8080/tcp' not in firewall_ports.stdout"



- name: Bonus task 1
  block:
    - name: Copy Dockerfile 
      copy:
        src: files/Dockerfile
        dest: /opt/Dockerfile
        mode: 0644

    - name: Ensure Docker is running 
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Check if Docker image already exists 
      command: docker images -q prometheus_server_container
      register: image_exists
      changed_when: false
      ignore_errors: true

    - name: Build Docker image 
      command: docker build -t prometheus_server_container -f /opt/Dockerfile /opt
      register: built_result
      changed_when: built_result.rc == 0
      when: image_exists.stdout == ""
  when: deployment_method == "container"



- name: Check if prometheus server service exists
  systemd:
    name: prometheus_server
  register: prometheus_service_status
  changed_when: false

- name: Stop running prometheus server service
  systemd:
    name: prometheus_server
    enabled: no
    state: stopped
    daemon_reload: yes
  when: prometheus_service_status.status.ActiveState == 'active'

- name: Create prometheus server service
  template:
    src: prometheus_server_service.j2
    dest: /etc/systemd/system/prometheus_server.service
    mode: 0644

- name: Enable and start prometheus server service
  systemd:
    name: prometheus_server
    enabled: yes
    state: started
    daemon_reload: yes 

