---
- name: Apply configuration
  hosts: observed_servers 
  become: yes
  vars:
   deployment_method: "native"

  tasks:
   - name: Include observed role
     include_role:
      name: observed
     when: deployment_method == "native"
   
   - name: Include container role
     include_role:
      name: observed_container
     when: deployment_method == "container"

    # - name: Ensure firewall allows port 8080
    #   ufw:
    #    port: 8080
    #    state: enabled
    #    proto: tcp
   - name: Create a directory for files
     file:
      name: /opt/zhirk
      state: directory
      mode: 0644
      owner: root
      group: root

   - name: Install prometheus-client
     pip:
      name: prometheus-client
      state: latest

   - name: Copy server script
     copy:
      src: roles/observed/files/prometheus_server.py
      dest: /opt/zhirk/prometheus_server.py
      mode: 0644
#####?
   - name: Create service
     template:
      src: roles/observed/templates/prometheus_server_service.j2
      dest: /etc/systemd/system/prometheus_server.service # prometheus_container_server.service
      mode: 0644
    #  vars:
    #   deployment_method: "{{ deployment_method }}"

   - name: Enable and start service
     systemd:
      name: prometheus_server # prometheus_container_server
      enabled: yes
      state: started
      daemon_reload: yes 
     
